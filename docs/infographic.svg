<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="20" font-weight="700" fill="#111827">omp-cairn-blackboard</text>
  <text x="30" y="54" font-size="13" fill="#4b5563">Agents share a fact–intent graph in SQLite instead of messaging each other.</text>

  <!-- Row 1: who talks to what -->
  <rect x="30" y="70" width="230" height="64" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="145" y="98" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">Controller + subagents</text>
  <text x="145" y="118" font-size="12" fill="#4b5563" text-anchor="middle">omp agents, one per intent</text>

  <line x1="260" y1="102" x2="296" y2="102" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="300" y="70" width="260" height="64" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="430" y="98" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">17 board tools (xd://)</text>
  <text x="430" y="118" font-size="12" fill="#4b5563" text-anchor="middle">validated, then one rule per call</text>

  <line x1="560" y1="102" x2="596" y2="102" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="600" y="70" width="270" height="64" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="735" y="98" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">One SQLite board per project</text>
  <text x="735" y="118" font-size="12" fill="#4b5563" text-anchor="middle">WAL · ~/.omp/agent/fact-boards/</text>

  <!-- Row 2: hooks and viewer -->
  <line x1="383" y1="134" x2="383" y2="166" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="391" y="155" font-size="11" fill="#4b5563">tool_call</text>

  <rect x="30" y="170" width="222" height="70" rx="10" fill="#fff7ed" stroke="#c2410c"/>
  <text x="141" y="194" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Compaction pointer</text>
  <text x="141" y="214" font-size="12" fill="#4b5563" text-anchor="middle">names only, never board text</text>
  <text x="141" y="231" font-size="12" fill="#4b5563" text-anchor="middle">reload step in the summary</text>

  <rect x="272" y="170" width="222" height="70" rx="10" fill="#fff7ed" stroke="#c2410c"/>
  <text x="383" y="194" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">In-session reminder</text>
  <text x="383" y="214" font-size="12" fill="#4b5563" text-anchor="middle">24 calls, no board touch</text>
  <text x="383" y="231" font-size="12" fill="#4b5563" text-anchor="middle">10 min apart · max 3</text>

  <rect x="514" y="170" width="222" height="70" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="625" y="194" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Light dispatcher</text>
  <text x="625" y="214" font-size="12" fill="#4b5563" text-anchor="middle">unclaimed intent → one subagent</text>
  <text x="625" y="231" font-size="12" fill="#4b5563" text-anchor="middle">graph changed, none running → Reason</text>

  <rect x="756" y="170" width="214" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text x="863" y="194" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">Viewer /fact-board</text>
  <text x="863" y="214" font-size="12" fill="#4b5563" text-anchor="middle">read-only · 127.0.0.1</text>
  <text x="863" y="231" font-size="12" fill="#4b5563" text-anchor="middle">List and Graph</text>

  <!-- Both read the board, on their own cadence -->
  <line x1="625" y1="134" x2="625" y2="166" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="633" y="152" font-size="11" fill="#4b5563">every 30 s</text>
  <line x1="863" y1="134" x2="863" y2="166" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="871" y="152" font-size="11" fill="#4b5563">poll 2 s</text>

  <!-- Row 3: intent lifecycle -->
  <text x="30" y="262" font-size="14" font-weight="600" fill="#111827">Intent lifecycle</text>

  <rect x="30" y="280" width="120" height="44" rx="22" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="90" y="307" font-size="13" fill="#111827" text-anchor="middle">reason_claim</text>
  <line x1="150" y1="302" x2="166" y2="302" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="170" y="280" width="120" height="44" rx="22" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="230" y="307" font-size="13" fill="#111827" text-anchor="middle">intent_create</text>
  <line x1="290" y1="302" x2="306" y2="302" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="310" y="280" width="130" height="44" rx="22" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="375" y="307" font-size="13" fill="#111827" text-anchor="middle">reason_release</text>
  <line x1="440" y1="302" x2="456" y2="302" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="460" y="280" width="120" height="44" rx="22" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="520" y="307" font-size="13" fill="#111827" text-anchor="middle">intent_claim</text>
  <line x1="580" y1="302" x2="596" y2="302" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="600" y="280" width="90" height="44" rx="22" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="645" y="307" font-size="13" fill="#111827" text-anchor="middle">work</text>
  <line x1="690" y1="302" x2="706" y2="302" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="710" y="280" width="150" height="44" rx="22" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="785" y="307" font-size="13" fill="#111827" text-anchor="middle">intent_conclude</text>
  <line x1="860" y1="302" x2="876" y2="302" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="880" y="280" width="90" height="44" rx="22" fill="#ecfdf5" stroke="#15803d"/>
  <text x="925" y="307" font-size="13" fill="#111827" text-anchor="middle">fact</text>

  <text x="30" y="346" font-size="12" fill="#4b5563">Reason lease: one holder, at most 2 intents per pass. Intent lease: a claim is a compare-and-swap on its token.</text>
  <text x="30" y="365" font-size="12" fill="#4b5563">No heartbeat for 900 s (FACT_BOARD_LEASE_SECONDS): the intent reopens. intent_release gives it back at once.</text>

  <!-- Row 4: rules -->
  <rect x="30" y="392" width="222" height="90" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="141" y="416" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Idempotent facts</text>
  <text x="141" y="436" font-size="12" fill="#4b5563" text-anchor="middle">same text, same id</text>
  <text x="141" y="455" font-size="12" fill="#4b5563" text-anchor="middle">repeat claims add new sources</text>

  <rect x="268" y="392" width="222" height="90" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="379" y="416" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Edges from the from list</text>
  <text x="379" y="436" font-size="12" fill="#4b5563" text-anchor="middle">a fact cites the facts it</text>
  <text x="379" y="455" font-size="12" fill="#4b5563" text-anchor="middle">builds on; none listed, no edge</text>

  <rect x="506" y="392" width="222" height="90" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="617" y="416" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Stale writers rejected</text>
  <text x="617" y="436" font-size="12" fill="#4b5563" text-anchor="middle">a lost lease cannot overwrite</text>
  <text x="617" y="455" font-size="12" fill="#4b5563" text-anchor="middle">its successor</text>

  <rect x="744" y="392" width="226" height="90" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="857" y="416" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">Best-effort redaction</text>
  <text x="857" y="436" font-size="12" fill="#4b5563" text-anchor="middle">applied before storage</text>
  <text x="857" y="455" font-size="12" fill="#4b5563" text-anchor="middle">not a secret vault</text>

  <text x="30" y="516" font-size="12" fill="#6b7280">Stored data is plain text in local files. The viewer never writes. See Trust model in the README.</text>
</svg>
